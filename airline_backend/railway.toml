[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --no-input"

[deploy]
startCommand = "python manage.py migrate && python manage.py create_initial_superuser && python manage.py seed_data --days 7 && gunicorn airline_backend.wsgi:application --bind 0.0.0.0:"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
